services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zero_farmer
      POSTGRES_USER: zero_farmer
      POSTGRES_PASSWORD: zero_farmer_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zero_farmer -d zero_farmer"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - zero_farmer_pg:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - zero_farmer_redis:/data

volumes:
  zero_farmer_pg:
  zero_farmer_redis:
